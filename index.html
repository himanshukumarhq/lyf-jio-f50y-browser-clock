<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Table Clock</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    font-family: Arial, Helvetica, sans-serif; }
  #stage { position:absolute; width:100vh; height:100vw; top:0; left:100vw;
    transform-origin:top left; -moz-transform-origin:top left;
    transform:rotate(90deg); -moz-transform:rotate(90deg);
    color:#00e676; }
  body.ccw #stage { top:100vh; left:0; transform:rotate(-90deg); -moz-transform:rotate(-90deg); }
  body.c1 #stage { color:#00e676; }
  body.c2 #stage { color:#ff5252; }
  body.c3 #stage { color:#40c4ff; }
  body.c4 #stage { color:#ffffff; }
  body.c5 #stage { color:#ffb300; }

  #box { position:absolute; top:0; bottom:0; left:0; right:24px; }
  body.ccw #box { left:34px; right:0; }

  #top { position:absolute; top:6px; left:10px; right:10px; display:flex; justify-content:space-between;
    align-items:baseline; font-size:25px; font-weight:bold; white-space:nowrap; }
  #day { text-transform:uppercase; letter-spacing:1px; }
  #mid { position:absolute; left:0; right:0; top:36px; bottom:38px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; white-space:nowrap; }
  #time { font-size:110px; font-weight:bold; line-height:1; letter-spacing:0; }
  #side { margin-top:6px; display:flex; align-items:baseline; justify-content:center; }
  #sec  { font-size:30px; font-weight:bold; line-height:1; }
  #ampm { font-size:22px; margin-left:12px; line-height:1; }
  #foot { position:absolute; left:10px; right:10px; bottom:8px; display:flex; align-items:center;
    justify-content:space-between; font-size:18px; }
  #battwrap { display:flex; align-items:center; }
  #battbox { width:42px; height:18px; border:2px solid currentColor; border-radius:3px; padding:1px; box-sizing:border-box; }
  #battfill { height:100%; width:0; background:currentColor; }
  #battcap { width:2px; height:6px; background:currentColor; margin-left:1px; }
  #battpct { margin-left:8px; }
  #hint { position:absolute; left:0; right:0; bottom:34px; text-align:center; font-size:12px; color:#777; }
  #dim  { position:absolute; top:0; left:0; right:0; bottom:0; background:#000000; opacity:0; pointer-events:none; }
</style>
</head>
<body class="c1">
<div id="stage"><div id="box">
  <div id="top"><span id="day"></span><span id="date"></span></div>
  <div id="mid"><div id="time">00:00</div><div id="side"><span id="sec"></span><span id="ampm"></span></div></div>
  <div id="hint">L-key colour &bull; OK 12/24h &bull; R-key flip &bull; &uarr;&darr; dim &bull; 5 fullscreen</div>
  <div id="foot">
    <span id="battwrap"><span id="battbox"><div id="battfill"></div></span><span id="battcap"></span><span id="battpct"></span></span>
    <span id="chg"></span>
  </div>
</div></div>
<div id="dim"></div>

<script>
(function () {
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var $ = function (id) { return document.getElementById(id); };

  var s = { h24: false, colour: 1, dim: 0, ccw: false };
  try {
    var saved = JSON.parse(localStorage.getItem('tc2') || 'null');
    if (saved) { for (var k in saved) { s[k] = saved[k]; } }
  } catch (e) {}
  function save() { try { localStorage.setItem('tc2', JSON.stringify(s)); } catch (e) {} }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function render() {
    var d = new Date(), h = d.getHours(), suffix = '';
    if (!s.h24) { suffix = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) { h = 12; } }
    $('time').textContent = (s.h24 ? pad(h) : h) + ':' + pad(d.getMinutes());
    $('sec').textContent = pad(d.getSeconds());
    $('ampm').textContent = suffix;
    $('day').textContent = DAYS[d.getDay()];
    $('date').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function applyLook() {
    document.body.className = 'c' + s.colour + (s.ccw ? ' ccw' : '');
    $('dim').style.opacity = (s.dim * 0.25).toFixed(2);
  }

  function tick() { render(); setTimeout(tick, 1000 - (Date.now() % 1000)); }

  function fullscreen() {
    var el = document.documentElement;
    try {
      (el.requestFullscreen || el.mozRequestFullScreen || el.webkitRequestFullscreen || function () {}).call(el);
    } catch (e) {}
  }

  document.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'SoftLeft':  s.colour = s.colour % 5 + 1; break;
      case 'Enter':     s.h24 = !s.h24; break;
      case 'SoftRight': s.ccw = !s.ccw; break;
      case 'ArrowUp':   s.dim = Math.max(0, s.dim - 1); break;
      case 'ArrowDown': s.dim = Math.min(3, s.dim + 1); break;
      case '5':         fullscreen(); break;
      default: return;
    }
    e.preventDefault();
    save(); applyLook(); render();
  });

  setTimeout(function () { $('hint').style.display = 'none'; }, 8000);

  var lock = null;
  function keepAwake() {
    try { if (navigator.requestWakeLock && !lock) { lock = navigator.requestWakeLock('screen'); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { try { if (lock) { lock.unlock(); } } catch (e) {} lock = null; }
    else { keepAwake(); }
  });

  try {
    if (navigator.getBattery) {
      navigator.getBattery().then(function (b) {
        function upd() {
          var p = Math.round(b.level * 100);
          $('battfill').style.width = p + '%';
          $('battpct').textContent = p + '%';
          $('chg').textContent = b.charging ? 'Charging \u26A1' : '';
        }
        upd();
        b.addEventListener('levelchange', upd);
        b.addEventListener('chargingchange', upd);
      });
    }
  } catch (e) {}

  // save a copy on the phone so the clock opens without internet (needs https)
  try {
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  } catch (e) {}

  applyLook(); keepAwake(); tick();
})();
</script>
</body>
</html>
